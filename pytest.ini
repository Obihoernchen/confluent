# Test configuration for confluent.
#
# Kept as a standalone file rather than a pyproject.toml, matching the existing
# ruff.toml / pyrefly.toml convention. Each component is packaged independently
# from its own setup.py.tmpl, so the repository root is deliberately not an
# installable Python project.

[pytest]
testpaths = tests

# confluent_server/confluent and confluent_client/confluent are both PEP 420
# namespace packages that merge into a single "confluent" package, and the
# server cannot import without the client (confluent.asynctlvdata,
# confluent.tlvdata and confluent.sortutil live only in the client tree). Both
# roots therefore have to be on the path at once. pyrefly.toml does the same.
pythonpath = confluent_server confluent_client

# The codebase is asyncio throughout, so every async def test_* should just run.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# --dist loadgroup is inert without -n, so this changes nothing about a normal
# run. It is set here so that whoever first reaches for -n gets a safe
# distribution instead of the default, which splits a file across workers and
# silently makes tests/unit/test_fixture_isolation.py stop proving anything.
# With it, an xdist_group mark keeps related tests on one worker: one group
# per physical device, so concurrent load on a controller stays at what a
# single client would produce.
#
# Note --timeout applies to every test. A long-running test, an OS deployment
# especially, needs its own @pytest.mark.timeout.
addopts = -ra --strict-markers --timeout=60 --dist loadgroup

markers =
    integration: needs a temp datastore, sockets or subprocesses (not a pure unit test)
    hardware: needs a real BMC or a running daemon, skipped unless CONFLUENT_TEST_* is set
    lab: needs a provisioned deployment lab, skipped unless CONFLUENT_TEST_LAB is set
    readonly: sends no writes at all
    reversible: writes, but restores the prior state and never interrupts service
    disruptive: interrupts service on the device, but it recovers without a human
    destructive: may leave the device needing manual recovery, or risks data loss

# A forgotten await is a silent no-op at runtime and the single most likely
# regression in a codebase with this many await sites, so make it fail the run.
# Later entries take precedence over earlier ones, hence "default" first.
#
# Both rules are needed. Which one fires depends on how the interpreter
# delivers the warning: on Python 3.14 an un-awaited coroutine is reported
# through the unraisable hook while it is being finalized, so it arrives as
# PytestUnraisableExceptionWarning and the RuntimeWarning rule alone catches
# nothing. Verified by deliberately dropping an await and running with
# -p no:unraisableexception, which then passes. Do not drop either rule
# without re-checking that a missing await still fails the suite.
#
# The warning is raised when the coroutine is garbage collected, which can be
# well after the offending test finished, in which case an innocent later test
# is blamed. The autouse _collect_garbage fixture in tests/conftest.py forces a
# collection after each test so the failure lands in the right place.
filterwarnings =
    default
    error:coroutine .* was never awaited:RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
